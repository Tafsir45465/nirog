{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block body %}
<div style="min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:2rem 1rem;">
  <div style="width:100%;max-width:520px;">
    <div class="card">
      <div style="text-align:center;margin-bottom:1.75rem;">
        <div style="font-size:2rem;font-weight:800;color:var(--c-primary)">Create your account</div>
        <p style="color:var(--c-muted);margin-top:.4rem">Register as a patient to book appointments</p>
      </div>
      <div id="error-msg" class="alert alert-danger" style="display:none"></div>
      <div id="success-msg" class="alert alert-success" style="display:none"></div>
      <form id="reg-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="full_name">Full name *</label>
            <input type="text" id="full_name" name="full_name" required placeholder="Your full name">
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="+880…">
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email address *</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="Min. 8 characters">
          </div>
          <div class="form-group">
            <label for="date_of_birth">Date of birth</label>
            <input type="date" id="date_of_birth" name="date_of_birth">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
              <option value="">Select…</option>
              <option>Male</option><option>Female</option><option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="blood_group">Blood group</label>
            <select id="blood_group" name="blood_group">
              <option value="">Select…</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option>
              <option>O+</option><option>O-</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:.5rem" id="submit-btn">
          Create account
        </button>
      </form>
      <hr class="divider">
      <p class="text-center text-muted">Already have an account? <a href="/auth/login">Sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('reg-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('error-msg');
  const suc = document.getElementById('success-msg');
  err.style.display = 'none'; suc.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Creating…';

  const payload = {
    full_name: this.full_name.value.trim(),
    email: this.email.value.trim(),
    password: this.password.value,
    phone: this.phone.value.trim() || undefined,
    date_of_birth: this.date_of_birth.value || undefined,
    gender: this.gender.value || undefined,
    blood_group: this.blood_group.value || undefined,
  };

  const {ok, data} = await api('POST', '/api/auth/register', payload);
  if(!ok){
    err.textContent = data.message || 'Registration failed.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create account';
    return;
  }
  suc.textContent = 'Account created! Redirecting to login…';
  suc.style.display = 'block';
  setTimeout(()=> window.location.href = '/auth/login', 1500);
});
</script>
{% endblock %}
