<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirog - Offline</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .offline-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.7;
        }
        .btn {
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: var(--c-primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            cursor: pointer;
        }
        .btn:hover {
            background-color: var(--c-primary-dk);
        }
    </style>
</head>
<body>
    <div class="offline-icon">📵</div>
    <h1>You're offline</h1>
    <p>Please check your internet connection to continue using Nirog.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
</body>
</html>
